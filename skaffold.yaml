apiVersion: skaffold/v4beta3
kind: Config
manifests:
  rawYaml:
    - ./infra/k8s/*
build:
  local:
    push: false
  artifacts:
    - image: ghcr.io/pooriaeshghi/ticketing-auth
      context: auth
      docker:
        dockerfile: Dockerfile
        target: development
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ghcr.io/pooriaeshghi/ticketing-client
      context: client
      docker:
        dockerfile: Dockerfile
        target: development
      sync:
        manual:
          - src: "**/*.js"
            dest: .
          - src: "**/*.css"
            dest: .
    - image: ghcr.io/pooriaeshghi/ticketing-tickets
      context: tickets
      docker:
        dockerfile: Dockerfile
        target: development
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ghcr.io/pooriaeshghi/ticketing-orders
      context: orders
      docker:
        dockerfile: Dockerfile
        target: development
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ghcr.io/pooriaeshghi/ticketing-expiration
      context: expiration
      docker:
        dockerfile: Dockerfile
        target: development
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ghcr.io/pooriaeshghi/ticketing-payments
      context: payments
      docker:
        dockerfile: Dockerfile
        target: development
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
